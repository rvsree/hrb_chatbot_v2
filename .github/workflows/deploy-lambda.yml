name: Deploy Lambda

# Separate from deploy.yml on purpose - that workflow only knows about the
# main App Runner image/service, and nothing in it ever touches the Phase
# 88 Lambda (hrb-chatbot-index-document). Every Lambda deploy before this
# workflow existed was a manual docker buildx build + ECR push +
# `aws lambda update-function-code`, run by hand - see
# docs/agent-reference/BACKLOG.md's "No CI/CD automation deploys the
# Lambda" entry for the real bug this already caused once (Phase 89 shipped
# code the Lambda silently never got, caught only by a live test).
#
# `paths:` is deliberately the whole src/hrb_chatbot/** tree, not just
# lambda_handlers/ - Dockerfile.lambda COPYs the entire tree into the
# image (`ai/doc_processing/pipeline.py` and everything it imports runs
# inside the Lambda too), so a change anywhere in there can affect what
# the Lambda actually does, same as it affects the main app.
on:
  push:
    branches: ["master"]
    paths:
      - "src/hrb_chatbot/**"
      - "Dockerfile.lambda"
      - "requirements.txt"
      - ".github/workflows/deploy-lambda.yml"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: 418884736369.dkr.ecr.us-east-1.amazonaws.com/hrb-chatbot-lambda
  LAMBDA_FUNCTION_NAME: hrb-chatbot-index-document

jobs:
  build-and-deploy-lambda:
    name: Build, push, and update the Lambda
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin ${{ env.ECR_REPOSITORY }}

      - name: Build and push the Lambda image
        # Same three flags as deploy.yml's own build step, same reason -
        # a plain `docker build` produces an attestation/manifest-list
        # image that Lambda's CreateFunction/UpdateFunctionCode rejects
        # the same way App Runner once did (see RAG-ROADMAP.md Phase 88).
        run: |
          docker buildx build \
            --provenance=false --sbom=false \
            --output type=image,name=${{ env.ECR_REPOSITORY }}:latest,oci-mediatypes=false,push=true \
            -f Dockerfile.lambda .

      - name: Update the Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --image-uri ${{ env.ECR_REPOSITORY }}:latest \
            --region ${{ env.AWS_REGION }}

      - name: Wait for the update to actually finish
        # update-function-code returns almost immediately - LastUpdateStatus
        # is what actually confirms the new image is live, same reasoning
        # as deploy.yml's own App Runner RUNNING-status poll below.
        run: |
          for i in $(seq 1 30); do
            STATUS=$(aws lambda get-function-configuration \
              --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
              --region ${{ env.AWS_REGION }} --query "LastUpdateStatus" --output text)
            echo "Lambda LastUpdateStatus: $STATUS (check $i/30)"
            if [ "$STATUS" = "Successful" ]; then
              exit 0
            fi
            if [ "$STATUS" = "Failed" ]; then
              echo "::error::Lambda update failed"
              exit 1
            fi
            sleep 5
          done
          echo "::error::Timed out waiting for the Lambda update to finish"
          exit 1
