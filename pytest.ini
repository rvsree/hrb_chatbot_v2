[pytest]
testpaths = tests
# Lets an `async def test_...` function run without needing
# @pytest.mark.asyncio on every single one - this project's own client/
# service functions are async throughout (aiosqlite, the DB gateway's
# metadata_store()/vector_store() methods), so nearly every test here
# would need that decorator without this setting.
asyncio_mode = auto
markers =
    eval: golden-dataset evaluation tests - real API calls, real cost, run explicitly with `pytest -m eval`
# Excludes eval-marked tests from a plain `pytest -v` - keeps the default
# suite's zero-cost/zero-API-key guarantee (docs/agent-reference/TESTING-GUIDE.md).
addopts = -m "not eval"
